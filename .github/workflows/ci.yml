name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    name: lint, type-check, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-serving.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: |
          pip install --no-cache-dir -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Type check (mypy, advisory)
        run: mypy --ignore-missing-imports --no-error-summary src/frauddet/api src/frauddet/serving.py || true
      - name: Unit + integration tests
        env:
          PYTHONPATH: src
        run: pytest -q -p no:cacheprovider

  container:
    name: build image and smoke-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-serving.txt
      - name: Build synthetic serving artifacts (real code paths, fake data)
        env:
          PYTHONPATH: src
        run: |
          pip install --no-cache-dir -r requirements-serving.txt
          python -m frauddet.demo_artifacts --out ci-demo --rows 3000
      - name: Build image
        run: |
          docker build \
            --build-arg DATASET=ulb --build-arg PROTOCOL=temporal \
            --build-arg ARTIFACTS=ci-demo/artifacts --build-arg EXPERIMENTS=ci-demo/experiments \
            -t frauddet-api:ci .
          docker image inspect frauddet-api:ci --format 'size={{.Size}} user={{.Config.User}}'
      - name: Run container (hardened) and smoke-test
        run: |
          docker run -d --name api --read-only --tmpfs /tmp:size=64m --cap-drop ALL \
            --security-opt no-new-privileges:true --user 10001:10001 -p 127.0.0.1:8000:8000 frauddet-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi; sleep 2; done
          curl -fsS http://127.0.0.1:8000/health | tee health.json
          python - <<'EOF'
          import json, urllib.request
          ev = {"Time": 100.0, "Amount": 12.5, **{f"V{i}": 0.1 * i for i in range(1, 29)}}
          req = urllib.request.Request("http://127.0.0.1:8000/predict", data=json.dumps(ev).encode(),
                                       headers={"content-type": "application/json", "x-request-id": "ci-smoke"})
          body = json.loads(urllib.request.urlopen(req, timeout=10).read())
          assert body["decision"] in ("APPROVED", "SUSPECT") and 0 <= body["fraud_probability"] <= 1, body
          assert body["request_id"] == "ci-smoke" and body["model_id"].startswith("ulb/temporal:lightgbm@"), body
          bad = urllib.request.Request("http://127.0.0.1:8000/predict", data=json.dumps({**ev, "Amount": -1}).encode(),
                                       headers={"content-type": "application/json"})
          try:
              urllib.request.urlopen(bad, timeout=10); raise SystemExit("expected 422")
          except urllib.error.HTTPError as e:
              assert e.code == 422, e.code
          print("smoke ok:", body["decision"], body["latency_ms"], "ms")
          EOF
          docker logs api | tail -n 5
          docker rm -f api
